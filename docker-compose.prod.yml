services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "9000"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_UPSTREAM: app:9000
      PORT: 8080
    expose:
      - "8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    command:
      - /usr/local/bin/start-queue

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    command:
      - /usr/local/bin/start-scheduler
