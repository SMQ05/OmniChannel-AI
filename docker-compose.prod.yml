services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    expose:
      - "9000"
    networks:
      - coolify

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    init: true
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_UPSTREAM: app:9000
      PORT: 80
    expose:
      - "80"
    networks:
      - coolify

  redis:
    image: redis:7-alpine
    init: true
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    expose:
      - "6379"
    networks:
      - coolify

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      - app
    stop_grace_period: 70s
    command:
      - /usr/local/bin/start-queue
    networks:
      - coolify

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      - app
    stop_grace_period: 70s
    command:
      - /usr/local/bin/start-scheduler
    networks:
      - coolify

  voice-gateway:
    build:
      context: ./services/voice-gateway
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      - nginx
      - redis
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      LARAVEL_INTERNAL_BASE_URL: http://nginx
      REDIS_URL: redis://redis:6379/0
    expose:
      - "3001"
    networks:
      - coolify

networks:
  coolify:
    external: true
