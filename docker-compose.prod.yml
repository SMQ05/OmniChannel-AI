services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    expose:
      - "9000"
    networks:
      - coolify

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    init: true
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_UPSTREAM: app:9000
      PORT: 80
    expose:
      - "80"
    networks:
      - coolify

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      - app
    stop_grace_period: 70s
    command:
      - /usr/local/bin/start-queue
    networks:
      - coolify

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      - app
    stop_grace_period: 70s
    command:
      - /usr/local/bin/start-scheduler
    networks:
      - coolify

networks:
  coolify:
    external: true
